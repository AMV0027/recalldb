[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recalldb"
version = "0.1.0"
authors = [
  { name = "Arunmozhi Varman", email = "arun@bloombig.agency" },
]
description = "A local-first, bitemporal hybrid persistent memory engine and reproducible benchmark for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
recalldb = "recalldb.cli.main:main"
membench = "recalldb.bench.cli:main"

[tool.setuptools.packages.find]
where = ["app"]
include = ["recalldb*"]
